<style>
/* Mağaza Performans Takip — tek stil dosyası.
   Açık tema esas; renkler değişkenlerden geliyor. */
:root{
  --arka:#cfc7b6; --kagit:#f6f2e9; --cizgi:#6f6552; --cizgi-ince:#9a8e77; --yazi:#141417; --soluk:#55555f;
  --vurgu:#a87c38; --koyu:#1d1d1f; --artis:#236437; --dusus:#96302f; --acik-vurgu:#f2e6cf;
  --golge:0 2px 10px rgba(0,0,0,.10); --golge-buyuk:0 12px 40px rgba(0,0,0,.26);
  /* Panel ve tablo çerçeveleri tek yerden kalınlaşsın. */
  /* Ara zeminler: rozet, tablo başlığı, satır vurgusu, bugün sütunu */
  --zemin-2:#e4dcc9; --zemin-3:#e6dfcc; --zemin-hover:#ece4d2;
  --bugun-zemin:#efe4c8; --dusus-zemin:#f0d9d9;
  --cerceve:2px; --hucre-cizgi:2px;
  --r:10px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--arka); color:var(--yazi); font-size:14px;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  /* Sayfa kısa olduğunda da alt bilgi ekranın en altında dursun. */
  min-height:100vh; display:flex; flex-direction:column;
}
#kok{ flex:1 0 auto; }
.alt-bilgi{
  flex:0 0 auto; text-align:center; color:var(--soluk); font-size:.68rem;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:var(--cerceve) solid var(--cizgi); background:var(--kagit);
}
button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
h1,h2,h3,h4{ margin:0; font-weight:650; }
table{ border-collapse:collapse; }
.acilis{ padding:40px; text-align:center; color:var(--soluk); }

.mini{
  background:var(--kagit); border:1px solid var(--cizgi); border-radius:8px;
  padding:6px 11px; font-size:.8rem; cursor:pointer; white-space:nowrap;
}
.mini:hover{ border-color:var(--vurgu); }
.mini.birincil{ background:var(--vurgu); border-color:var(--vurgu); color:#fff; font-weight:600; }
.mini.birincil:hover{ filter:brightness(1.06); }
.mini.secili{ background:var(--acik-vurgu); border-color:var(--vurgu); color:#8a6a2f; font-weight:600; }
.mini:disabled{ opacity:.45; cursor:default; }
.artis{ color:var(--artis); }
.dusus{ color:var(--dusus); }
.sabit{ color:var(--soluk); }
.menu-bos,.bulgu-bos{ color:var(--soluk); font-size:.82rem; padding:10px 2px; }
.aciklama{ color:var(--soluk); font-size:.76rem; line-height:1.5; margin:8px 0 0; }
.bolum-ust{ display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.bolum-ust h2{ font-size:1.1rem; }
.bolum-ust .alt{ color:var(--soluk); font-size:.78rem; }

/* ---------- Giriş ---------- */
.giris-ekran{
  min-height:100vh; background:#141416; color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:34px 18px;
}
.giris-ekran h1{ font-weight:400; font-size:1.6rem; }
/* Bulut girişi */
.giris-kutu{
  background:#1b1b1e; border:1px solid #2e2e33; border-radius:16px;
  padding:26px 26px 20px; width:min(360px,100%); display:flex; flex-direction:column; gap:2px;
}
.giris-kutu.genis{ width:min(520px,100%); }
.giris-kutu h1{ font-size:1.15rem; text-align:center; margin-bottom:14px; }
.giris-logo{ width:52px; height:52px; margin:0 auto 10px; border-radius:12px; background:#26262b center/contain no-repeat; }
.giris-etiket{ font-size:.72rem; color:#8b8b93; margin:10px 0 4px; }
.giris-girdi{
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid #3a3a40;
  background:#242428; color:#fff; font-size:.9rem;
}
.giris-girdi:focus{ outline:none; border-color:var(--vurgu); }
.giris-kutu .mini.birincil{ width:100%; margin-top:14px; padding:10px; }
.giris-bag{
  background:none; border:none; color:#8b8b93; font-size:.76rem; cursor:pointer;
  margin-top:10px; text-decoration:underline; font-family:inherit;
}
.giris-bag:hover{ color:#fff; }
.giris-aciklama{ color:#9a9aa2; font-size:.82rem; line-height:1.55; margin:0 0 6px; }
.giris-hata{ color:#e08484; font-size:.78rem; min-height:18px; margin-top:8px; white-space:pre-line; }
.giris-hata.iyi{ color:#7fb77f; }
.profil-izgara{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:16px; width:min(900px,100%); }
.profil-kart{ background:none; border:none; padding:0; cursor:pointer; text-align:center; }
.p-simge{
  display:flex; align-items:center; justify-content:center;
  width:100%; aspect-ratio:1; border-radius:12px; font-size:2.1rem; color:#fff;
  border:3px solid transparent; transition:border-color .15s, transform .15s;
}
.profil-kart:hover .p-simge{ border-color:#fff; transform:scale(1.04); }
.profil-kart.ozel .p-simge{ box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
.p-ad{ display:block; margin-top:8px; font-size:.82rem; color:#9a9aa2; }
.profil-kart:hover .p-ad{ color:#fff; }
.giris-sifre{ display:flex; flex-direction:column; align-items:center; gap:10px; width:min(320px,100%); }
.secilen-profil{ display:flex; align-items:center; gap:10px; font-size:1rem; }
.secilen-profil .p-simge{ width:40px; height:40px; font-size:1.2rem; border-width:0; }
.sifre-girdi{ width:100%; padding:10px 12px; border-radius:var(--r); border:1px solid #38383c; background:#1e1e21; color:#fff; }
.sifre-girdi:focus{ outline:none; border-color:var(--vurgu); }
.giris-sifre .mini{ width:100%; background:#1e1e21; border-color:#38383c; color:#ddd; }
.giris-sifre .mini.birincil{ background:var(--vurgu); color:#141416; border-color:var(--vurgu); }
.giris-hata{ color:#e08484; font-size:.8rem; min-height:16px; }
.giris-not{ color:#6d6d75; font-size:.74rem; margin:0; }

/* ---------- Üst çubuk ---------- */
.ust-cubuk{
  position:sticky; top:0; z-index:40; background:var(--kagit); border-bottom:var(--cerceve) solid var(--cizgi);
  display:flex; align-items:center; gap:12px; padding:7px 14px; flex-wrap:wrap;
}
.ust-logo{
  flex:0 0 auto; width:34px; height:34px; padding:0; border:1px solid transparent;
  border-radius:9px; background:none; cursor:pointer; overflow:hidden;
  display:flex; align-items:center; justify-content:center; transition:border-color .12s, transform .12s;
}
.ust-logo img{ width:100%; height:100%; display:block; border-radius:8px; }
.ust-logo:hover{ border-color:var(--vurgu); transform:scale(1.04); }
.menu{ display:flex; gap:4px; flex-wrap:wrap; }
.menu-btn{
  background:none; border:none; padding:7px 12px; border-radius:8px;
  font-size:.84rem; font-weight:600; color:var(--soluk); cursor:pointer;
}
.menu-btn:hover{ background:var(--zemin-2); color:var(--yazi); }
.menu-btn.secili{ background:var(--acik-vurgu); color:#8a6a2f; }
.ust-orta{ flex:1; display:flex; justify-content:center; }
.magaza-sec{ padding:6px 10px; border-radius:8px; border:1px solid var(--cizgi); background:var(--kagit); }
.ust-sag{ display:flex; align-items:center; gap:8px; margin-left:auto; }
.profil-rozet{
  display:flex; align-items:center; gap:7px; background:var(--zemin-2); border:1px solid var(--cizgi);
  border-radius:20px; padding:3px 12px 3px 4px; cursor:pointer; font-size:.78rem; font-weight:600;
}
.profil-rozet:hover{ background:#e9e5dc; }
.p-simge.kucuk{ width:24px; height:24px; aspect-ratio:auto; font-size:.85rem; border-radius:50%; border:none; }

.sayfa{ padding:16px; }
.bos-sayfa{ background:var(--kagit); border:var(--cerceve) solid var(--cizgi); border-radius:var(--r); padding:26px; }
.bos-sayfa p{ color:var(--soluk); }

/* ---------- Hafta gezinme ---------- */
/* Solda hafta seçimi (içerik kadar yer kaplar), sağda duyurular. */
.gez-sol,.gez-sag{ min-width:0; display:flex; flex-direction:column; }
.duyuru-serit{ display:flex; flex-direction:column; gap:7px; min-height:0; overflow-y:auto; }
/* Her duyuru ayrı bir mesaj balonu; tek satır, tamamı ipucunda. */
.duyuru-satir{
  position:relative; background:var(--acik-vurgu); border:1px solid #e0cda4;
  border-left:3px solid var(--vurgu); border-radius:4px 10px 10px 4px;
  padding:6px 10px 6px 11px; font-size:.74rem; line-height:1.4; color:#5f4a22;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 1px 3px rgba(0,0,0,.07);
}
.duyuru-satir::before{ content:'📢'; margin-right:6px; opacity:.6; font-size:.7rem; }
.duyuru-bos{ color:var(--soluk); font-size:.74rem; }

/* ---------- Haftalık rutin ---------- */
.rutin-blok{ min-width:0; display:flex; flex-direction:column; }
.rutin-ust{ display:flex; align-items:center; justify-content:flex-end; margin-bottom:3px; }
.rutin-sayac{ font-size:.68rem; font-weight:700; color:var(--soluk); background:var(--zemin-2); border-radius:20px; padding:1px 8px; }
.rutin-sayac.tamam{ background:#e6f2ea; color:var(--artis); }
.rutin-blok .tablo-sar{ flex:1; min-height:0; overflow:auto; }
.rutin-tablo{ width:100%; min-width:300px; table-layout:fixed; }
.rutin-tablo th{
  font-size:.64rem; font-weight:700; color:var(--soluk); padding:1px 2px;
  border-bottom:3px solid var(--cizgi); text-align:center;
}
.rutin-tablo th.bugun{ color:var(--vurgu); }
.rutin-tablo td{ vertical-align:top; padding:3px 2px; border-right:var(--hucre-cizgi) solid var(--cizgi-ince); }
.rutin-tablo td:last-child{ border-right:none; }
.rutin-tablo td.bugun{ background:var(--bugun-zemin); }
/* Sade yazı; üzerine gelince kutuya döner, tıklanınca yeşile. */
.rutin-madde{
  display:flex; align-items:center; gap:2px; font-size:.68rem; line-height:1.3;
  border:1px solid transparent; border-radius:6px; padding:2px 4px; margin-bottom:2px;
}
.rutin-madde:hover{ background:var(--kagit); border-color:var(--cizgi); }
.rutin-madde .r-metin{
  flex:1; min-width:0; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.rutin-madde.bitti{ background:#e6f2ea; border-color:#bcdcc6; }
.rutin-madde.bitti .r-metin{ color:var(--artis); font-weight:600; text-decoration:line-through; }
.rutin-madde .r-sil{
  border:none; background:none; color:#c9c9cf; cursor:pointer; font-size:.6rem; padding:0 2px;
  opacity:0; transition:opacity .12s;
}
.rutin-madde:hover .r-sil{ opacity:1; }
.rutin-madde .r-sil:hover{ color:var(--dusus); }
.rutin-ekle{
  width:100%; border:1px dashed var(--cizgi); background:none; color:#c3c3c9; border-radius:6px;
  cursor:pointer; font-size:.66rem; padding:0 2px; line-height:1.5; opacity:0; transition:opacity .12s;
}
.rutin-tablo td:hover .rutin-ekle{ opacity:1; }
.rutin-ekle:hover{ border-color:var(--vurgu); color:var(--vurgu); }
.rutin-girdi{
  width:100%; font-size:.66rem; padding:2px 4px; border:1px solid var(--vurgu);
  border-radius:6px; margin-bottom:2px;
}

/* ---------- Notion tarzı tuval ---------- */
.tuval{ display:flex; flex-direction:column; gap:12px; }
/* Bloklar yukarıdan hizalanır: her biri kendi içeriği kadar yer kaplar,
   kısa blokların altında boşluk kalmaz. */
.tuval-satir{ display:flex; align-items:flex-start; gap:0; min-width:0; }
.tuval-blok{
  position:relative; display:flex; flex-direction:column; min-width:0; min-height:70px;
  background:var(--kagit); border:var(--cerceve) solid var(--cizgi); border-radius:var(--r);
  padding:7px 10px 10px; overflow:hidden;
}
.tuval-blok > *:not(.blok-baslik):not(.blok-tutamak){ min-height:0; overflow:auto; }
.blok-baslik{ display:flex; align-items:center; gap:6px; margin-bottom:5px; flex:0 0 auto; }
.blok-ad{
  font-size:.72rem; font-weight:700; color:var(--soluk);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.panel-tut{
  flex:0 0 auto; width:17px; height:17px; padding:0; line-height:1; border-radius:5px;
  border:1px solid var(--cizgi); background:var(--kagit); color:#b9b9c0;
  font-size:.62rem; cursor:grab; opacity:0; transition:opacity .12s;
}
.tuval-blok:hover .panel-tut{ opacity:1; }
.panel-tut:hover{ color:var(--vurgu); border-color:var(--vurgu); }
.panel-tut:active{ cursor:grabbing; }
.blok-tutamak.alt{
  position:absolute; left:14px; right:14px; bottom:0; height:6px; cursor:row-resize;
  background:var(--vurgu); opacity:0; border-radius:3px; transition:opacity .12s;
}
.tuval-blok:hover .blok-tutamak.alt{ opacity:.2; }
.blok-tutamak.alt:hover{ opacity:.6 !important; }
.tuval-blok.tasiniyor{ opacity:.45; outline:2px dashed var(--vurgu); outline-offset:-2px; }
.tuval-blok.boyutlaniyor{ outline:2px solid var(--vurgu); outline-offset:-2px; }
.tuval.tasima-modu{ user-select:none; }

/* Sütunlar arasındaki tutamaç */
/* Yığın: bir sütunda alt alta duran bloklar. Her biri kendi boyu kadar. */
.tuval-yigin{ display:flex; flex-direction:column; gap:12px; min-width:0; }
/* Yerleşim kilitliyken sütunlar arasında sadece boşluk kalır. */
.tuval-aralik{ flex:0 0 12px; }
.tuval-ayirac{ flex:0 0 12px; cursor:col-resize; position:relative; }
.tuval-ayirac::after{
  content:''; position:absolute; left:50%; top:12px; bottom:12px; width:3px;
  transform:translateX(-50%); border-radius:3px; background:var(--vurgu);
  opacity:0; transition:opacity .12s;
}
.tuval-ayirac:hover::after,.tuval-satir.ayarlaniyor .tuval-ayirac::after{ opacity:.45; }

/* Bırakma göstergesi */
.birakma-isareti{
  position:absolute; z-index:500; background:var(--vurgu); border-radius:3px;
  box-shadow:0 0 0 3px rgba(200,160,102,.25); pointer-events:none;
}

.ay-satir{ display:flex; gap:2px; align-items:center; flex-wrap:wrap; }
.ay{ background:none; border:none; padding:4px 8px; border-radius:7px; cursor:pointer; font-size:.78rem; color:var(--soluk); }
.ay:hover{ background:var(--zemin-2); }
.ay.secili{ background:var(--koyu); color:#fff; font-weight:600; }
.yil-sec{ margin-left:6px; padding:4px 8px; border-radius:7px; border:1px solid var(--cizgi); background:var(--kagit); font-size:.78rem; }
/* Hafta seçimi bir bütün olarak çerçeveli dursun. */
.hafta-satir{
  display:flex; align-items:center; gap:6px; margin-top:7px;
  border:var(--cerceve) solid var(--cizgi); border-radius:var(--r);
  padding:6px; background:var(--kagit);
}
.hafta-listesi{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
/* Hafta kutusu: üstte ay içi sıra (büyük) ve yılın haftası (küçük, gri),
   altında tarih aralığı. İki satır — kutu boyu eskisiyle aynı kalsın diye. */
.hafta{
  background:var(--zemin-3); border:1px solid var(--cizgi); border-radius:8px; padding:4px 10px;
  cursor:pointer; text-align:center; white-space:nowrap; flex:0 0 auto; min-width:98px;
}
.hafta:hover{ border-color:var(--vurgu); }
.hafta.secili{ background:var(--acik-vurgu); border-color:var(--vurgu); }
.h-ust{ display:flex; align-items:baseline; justify-content:center; gap:5px; }
.h-sira{ font-size:.86rem; font-weight:800; line-height:1.1; }
.h-no{ font-size:.62rem; font-weight:600; color:var(--soluk); }
.hafta.secili .h-no{ color:var(--vurgu); }
.h-aralik{ display:block; font-size:.64rem; color:var(--soluk); line-height:1.3; }
.ok{ background:none; border:1px solid var(--cizgi); border-radius:8px; width:26px; height:26px; cursor:pointer; flex:0 0 auto; }

/* ---------- Ekran gövdesi ---------- */


/* ---------- Haftalık tablo ---------- */
.hafta-blok{ background:var(--kagit); border:var(--cerceve) solid var(--cizgi); border-radius:var(--r); overflow:hidden; }
.hafta-ust{ display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:var(--cerceve) solid var(--cizgi); flex-wrap:wrap; }
.hafta-baslik{ font-weight:700; font-size:.86rem; }
.hafta-hedef{ display:flex; align-items:center; gap:7px; margin-left:auto; }
.hafta-hedef .etiket{ color:var(--soluk); font-size:.76rem; }
.hedef-girdi{ width:96px; padding:3px 7px; border-radius:7px; border:1px solid var(--cizgi); text-align:right; font-size:.78rem; }
.oran-rozet{ background:var(--zemin-2); border-radius:20px; padding:2px 9px; font-weight:700; font-size:.78rem; }
.oran-rozet.artis{ background:#e6f2ea; color:var(--artis); }
.oran-rozet.dusus{ background:var(--dusus-zemin); color:var(--dusus); }
.hafta-urun{ display:flex; gap:6px; }
.tablo-sar{ overflow-x:auto; }
/* 2×2 düzende her tablo ekranın ~%37'sini kaplıyor; okunurluk için yazı
   büyütüldü, en küçük genişlik o sütuna sığacak kadar indirildi. */
/* Sabit sütun genişliği: izin etiketi gibi uzun içerik sütunu şişirip
   Formüller sütununu dışarı itmesin. Gün sütunları eşit bölünür. */
.hafta-tablo{ width:100%; min-width:620px; font-size:.82rem; table-layout:fixed; }
.hafta-tablo .kpi-sutun{ width:118px; }
.hafta-tablo .formul-sutun{ width:132px; }
.hafta-tablo th,.hafta-tablo td{ overflow:hidden; }
.hafta-tablo th,.hafta-tablo td{ border:var(--hucre-cizgi) solid var(--cizgi); padding:0; text-align:center; }
.hafta-tablo thead th{ border-bottom-width:4px; }
.hafta-tablo .kpi-sutun{ border-right-width:4px; }
.hafta-tablo .formul-sutun{ border-left-width:4px; }
.hafta-tablo thead th{ background:var(--zemin-3); padding:4px 3px; font-weight:600; vertical-align:top; }
.hafta-tablo thead th.bugun{ background:var(--acik-vurgu); }
.gun-ad{ display:block; font-size:.78rem; line-height:1.25; }
.gun-tarih{ display:block; font-size:.67rem; color:var(--soluk); font-weight:400; line-height:1.25; }
.izin-btn{
  margin-top:2px; width:100%; background:none; border:1px dashed var(--cizgi); border-radius:5px;
  padding:1px 3px; font-size:.65rem; color:var(--soluk); cursor:pointer;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.izin-btn.dolu{ background:var(--acik-vurgu); border-style:solid; border-color:var(--vurgu); color:#8a6a2f; font-weight:600; }
.kpi-sutun{ background:var(--zemin-3); text-align:left !important; padding:4px 7px !important; font-weight:700;
  font-size:.77rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* Formül metni uzun olabiliyor ("▼ %6,1 (ilk 5 gün)"); kırpmak yerine sarsın. */
.formul-sutun{ background:var(--zemin-3); font-weight:700; padding:4px 6px !important; font-size:.77rem;
  white-space:normal; line-height:1.3; }
.hucre{ width:100%; border:none; background:none; padding:4px 4px; text-align:center; font-variant-numeric:tabular-nums; }
.hucre:focus{ outline:2px solid var(--vurgu); outline-offset:-2px; background:#fff; }
.hucre:disabled{ color:var(--yazi); }
td.bugun{ background:var(--bugun-zemin); }
td.hesaplanan{ color:var(--soluk); font-size:.8rem; }

.simule-satir{ display:flex; align-items:center; gap:9px; font-size:.78rem; color:var(--soluk); flex-wrap:wrap; }
.simule-satir input{ padding:5px 8px; border-radius:7px; border:1px solid var(--cizgi); background:var(--kagit); }
.simule-not{ color:var(--vurgu); }

/* ---------- Sağ panel ---------- */

.panel-kutu{ background:var(--kagit); border:var(--cerceve) solid var(--cizgi); border-radius:var(--r); padding:12px; }
/* Tuvalde blok zaten çerçeveli; içteki kutu çıplak durur. */
.tuval-blok > .panel-kutu,.tuval-blok > .hafta-blok{ border:none; border-radius:0; padding:0; background:none; }
/* Sekmeli özet kutusu — üst menüyle aynı görünüm. */
.ozet-kutu{ padding:8px 10px 10px; }
.sekme-bar{ display:flex; gap:2px; border-bottom:3px solid var(--cizgi); margin-bottom:9px; padding-right:24px; }
.sekme{
  background:none; border:none; padding:5px 8px 6px; cursor:pointer;
  font-size:.75rem; font-weight:600; color:var(--soluk);
  border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap;
}
.sekme:hover{ color:var(--yazi); }
.sekme.secili{ color:var(--vurgu); border-bottom-color:var(--vurgu); }
.sekme-govde{ min-width:0; }
.panel-kutu h3{ font-size:.86rem; margin-bottom:3px; }
.panel-alt{ color:var(--soluk); font-size:.72rem; margin-bottom:9px; }
/* Sıkı kart: başlık + iki satır, değişim bugünün yanında. */
.kart-liste{ display:flex; flex-direction:column; gap:6px; }
.kart{ border:var(--cerceve) solid var(--cizgi); border-radius:8px; padding:5px 8px 6px; }
.kart-ust{ display:flex; align-items:center; justify-content:space-between; line-height:1.3; }
.kart-ad{ font-weight:700; font-size:.76rem; }
.kart-sil{ background:none; border:none; color:#c2c2ca; cursor:pointer; font-size:.68rem; padding:0 1px; line-height:1; }
.kart-sil:hover{ color:var(--dusus); }
.kart-satir{ display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:.74rem; margin-top:1px; color:var(--soluk); line-height:1.35; }
.kart-satir > span:first-child{ flex:0 0 38px; }
.kart-satir b{ color:var(--yazi); margin-left:auto; }
.kart-girdi{ width:74px; padding:1px 6px; border:1px solid var(--cizgi); border-radius:5px; text-align:right; font-size:.74rem; margin-left:auto; }
.kart-degisim{ flex:0 0 auto; font-size:.72rem; font-weight:700; min-width:62px; text-align:right; }
.kart-ekle{ width:100%; margin-top:7px; background:none; border:1px dashed var(--cizgi); border-radius:8px; padding:5px; cursor:pointer; color:var(--soluk); font-size:.76rem; }
.kart-ekle:hover{ border-color:var(--vurgu); color:var(--vurgu); }
.kart-form{ display:flex; flex-direction:column; gap:7px; }
.kart-form input,.kart-form select{ padding:6px 9px; border:1px solid var(--cizgi); border-radius:7px; }
.kart-form-alt{ display:flex; gap:6px; }
.yorum-alan{ width:100%; height:78px; padding:8px 10px; border:1px solid var(--cizgi); border-radius:8px; resize:vertical; }
.yorum-alan:focus{ outline:none; border-color:var(--vurgu); }
.yorum-durum{ font-size:.72rem; color:var(--artis); min-height:15px; margin-top:4px; }
.kiyas-tablo{ width:100%; font-size:.76rem; }
.kiyas-tablo th{ color:var(--soluk); font-weight:600; text-align:right; padding:3px 4px; border-bottom:2px solid var(--cizgi); }
.kiyas-tablo td{ border-bottom:var(--hucre-cizgi) solid var(--cizgi-ince); }
.kiyas-tablo td{ padding:4px; text-align:right; }
.kiyas-tablo td:first-child,.kiyas-tablo th:first-child{ text-align:left; }
.duyuru{ display:flex; gap:8px; align-items:flex-start; justify-content:space-between; background:var(--acik-vurgu); border-radius:8px; padding:8px 10px; font-size:.78rem; margin-bottom:6px; }

/* ---------- Bölge paneli ---------- */
.gorunum-cubugu{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px; font-size:.8rem; color:var(--soluk); }
.ozet-tablo{ width:100%; min-width:860px; background:var(--kagit); font-size:.78rem; }
.ozet-tablo th,.ozet-tablo td{ border:var(--hucre-cizgi) solid var(--cizgi); padding:5px 8px; text-align:right; }
.ozet-tablo thead th{ border-bottom-width:4px; }
.ozet-tablo thead th{ background:var(--zemin-3); text-align:center; }
.ozet-tablo .alt-baslik th{ font-weight:500; color:var(--soluk); font-size:.72rem; }
.ozet-tablo tbody tr{ cursor:pointer; }
.ozet-tablo tbody tr:hover{ background:var(--zemin-hover); }
.magaza-ad{ text-align:left !important; font-weight:600; white-space:nowrap; }
.nokta{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
.yorum-hucre{ text-align:left !important; color:var(--soluk); max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bolge-alt{ display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; margin-top:14px; }
.hedef-tur{ display:flex; gap:12px; font-size:.78rem; margin-bottom:9px; flex-wrap:wrap; }
.hedef-elle{ max-height:230px; overflow:auto; display:flex; flex-direction:column; gap:5px; }
.hedef-satir{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:.78rem; }
.hedef-satir input{ width:104px; padding:4px 8px; border:1px solid var(--cizgi); border-radius:6px; text-align:right; }
.hedef-yapistir{ width:100%; height:110px; padding:8px; border:1px solid var(--cizgi); border-radius:8px; font-family:ui-monospace,Menlo,monospace; font-size:.75rem; }
.hedef-sonuc{ margin-top:8px; font-size:.75rem; max-height:150px; overflow:auto; }
.hedef-sonuc .iyi{ color:var(--artis); }
.hedef-sonuc .kotu{ color:var(--dusus); }
.kural-satir{ display:flex; align-items:center; gap:7px; font-size:.8rem; margin-bottom:9px; }
.kural-yuzde{ width:70px; padding:4px 8px; border:1px solid var(--cizgi); border-radius:6px; }
.rapor-ust{ font-size:.82rem; margin-bottom:8px; }
.rapor-satir{ font-size:.78rem; padding:4px 0; border-bottom:1px solid var(--cizgi); }
.rapor-eksik{ margin-top:8px; font-size:.76rem; color:var(--dusus); }
.duyuru-alan{ width:100%; height:64px; padding:8px; border:1px solid var(--cizgi); border-radius:8px; margin-bottom:8px; resize:vertical; }
.duyuru-gecmis{ margin-top:10px; }

/* ---------- Kurucu ---------- */
.kurucu-izgara{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
/* Kullanıcı satırında ad, kullanıcı adı, şifre ve tuşlar yan yana sığsın. */
.kurucu-izgara .panel-kutu.genis{ grid-column:1 / -1; }
.kategori-blok{ border:1px solid var(--cizgi); border-radius:9px; padding:9px; margin-bottom:9px; }
.kategori-ust{ display:flex; gap:6px; }
.kat-ad{ flex:1; padding:5px 8px; border:1px solid var(--cizgi); border-radius:7px; font-weight:600; }
.kat-urun{ display:flex; gap:6px; margin-top:5px; }
.kat-urun input{ flex:1; padding:4px 8px; border:1px solid var(--cizgi); border-radius:6px; font-size:.8rem; }
.satir-ekle{ display:flex; gap:6px; margin-top:9px; }
.satir-ekle input{ flex:1; padding:6px 9px; border:1px solid var(--cizgi); border-radius:7px; }
.satir-ekle.kucuk input{ padding:4px 8px; font-size:.8rem; }
.kullanici-satir{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--cizgi); }
.k-simge{ width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:.9rem; flex:0 0 auto; }
.k-ad{ flex:0 1 250px; min-width:120px; padding:4px 8px; border:1px solid var(--cizgi); border-radius:6px; font-size:.8rem; }
.k-rol{ font-size:.68rem; color:var(--soluk); width:54px; flex:0 0 auto; }
.k-sifre-yerel{ width:78px; padding:4px 8px; border:1px solid var(--cizgi); border-radius:6px; font-size:.8rem; }
.k-mail{ flex:0 1 130px; min-width:0; font-size:.74rem; font-weight:600; color:var(--yazi);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  background:var(--acik-vurgu); border:1px solid var(--cizgi-ince); border-radius:6px; padding:3px 7px; }
.k-yeni-mail{ flex:0 1 120px; min-width:90px; padding:4px 7px; border:1px solid var(--cizgi); border-radius:6px; font-size:.74rem; }
.k-yeni-sifre,.k-eski-sifre,.k-yeni-sifre2{ flex:0 1 110px; min-width:90px; padding:4px 7px;
  border:1px solid var(--cizgi); border-radius:6px; font-size:.74rem; }
.k-magaza-sil{ margin-left:6px; }
/* Satırın sağı boş kalmasın: son öğeden sonra esneyen bir boşluk. */
.kullanici-satir::after{ content:''; flex:1 1 0; }
.magaza-ekle-satir{ border-top:var(--cerceve) solid var(--cizgi); padding-top:10px; }
.kullanici-satir{ flex-wrap:wrap; }
.satir-ayar{ display:flex; gap:6px; flex-wrap:wrap; }
.esik-satir{ display:flex; align-items:center; gap:8px; font-size:.82rem; }
.esik-satir input{ width:100px; padding:5px 9px; border:1px solid var(--cizgi); border-radius:7px; text-align:right; }
.etiket-satir{ display:flex; align-items:center; gap:8px; font-size:.8rem; padding:4px 0; }
.etiket-satir code{ background:var(--zemin-2); padding:2px 6px; border-radius:5px; }
.etiket-satir button{ margin-left:auto; }

/* ---------- Talep ---------- */
.talep-ekran{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start; }
.kategori-liste{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
.kategori{ background:var(--kagit); border:1px solid var(--cizgi); border-radius:var(--r); padding:12px; }
.kategori h4{ font-size:.84rem; margin-bottom:8px; }
/* Ürün satırı: ad · yeşil tik · artı ya da kalem */
.urun-satir{
  display:flex; align-items:center; gap:7px; padding:4px 2px; font-size:.8rem;
  border-bottom:1px solid var(--cizgi-ince); flex-wrap:wrap;
}
.urun-satir:last-child{ border-bottom:none; }
.urun-satir .u-ad{ flex:1; min-width:0; }
.urun-satir.secili .u-ad{ font-weight:600; }
.u-tik{ color:var(--artis); font-weight:700; font-size:.86rem; }
.u-dugme{
  flex:0 0 auto; width:24px; height:24px; border-radius:7px; cursor:pointer;
  border:1px solid var(--cizgi); background:var(--kagit); color:var(--soluk); font-size:.85rem; line-height:1;
}
.u-dugme.arti:hover{ border-color:var(--vurgu); color:var(--vurgu); }
.u-dugme.kalem{ border-color:var(--vurgu); color:var(--vurgu); background:var(--acik-vurgu); }
.u-notu{
  flex:0 0 100%; font-size:.72rem; color:#5f4a22; background:var(--acik-vurgu);
  border-radius:6px; padding:2px 8px; margin:1px 0 2px;
}
.u-not-girdi{ flex:0 0 100%; display:flex; gap:5px; margin:3px 0 2px; }
.u-not-girdi input{ flex:1; min-width:0; padding:4px 8px; border:1px solid var(--vurgu); border-radius:6px; font-size:.75rem; }
.u-not-girdi .sil:hover{ border-color:var(--dusus); color:var(--dusus); }
/* Bölge görünümü: kaç mağaza istedi */
.u-sayac{
  flex:0 0 auto; border:1px solid var(--cizgi); background:var(--kagit); border-radius:20px;
  padding:2px 10px; font-size:.72rem; font-weight:600; color:var(--yazi); cursor:pointer; white-space:nowrap;
}
.u-sayac.bos{ color:var(--soluk); cursor:default; font-weight:400; }
.u-sayac:not(.bos):hover{ border-color:var(--vurgu); color:var(--vurgu); }
.u-magazalar{ flex:0 0 100%; margin:3px 0 4px; border-left:2px solid var(--vurgu); padding-left:9px; }
.u-magaza{ display:flex; gap:8px; font-size:.74rem; padding:2px 0; }
.um-ad{ flex:0 0 130px; font-weight:600; }
.um-adet{ flex:0 0 40px; color:var(--soluk); }
.um-not{ flex:1; min-width:0; color:#5f4a22; }
.s-not{ display:block; font-style:normal; font-size:.68rem; color:#5f4a22; }
.rapor-liste{ max-height:320px; overflow:auto; }
.sepet-satir{ display:flex; align-items:center; gap:6px; font-size:.79rem; padding:4px 0; border-bottom:1px solid var(--cizgi); }
.s-ad{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.s-adet{ min-width:20px; text-align:center; font-weight:700; }
.sepet-not{ font-size:.74rem; color:var(--artis); margin-top:8px; }
.talep-sag .mini.birincil{ width:100%; margin-top:10px; }
.gecmis-satir{ border-bottom:1px solid var(--cizgi); padding:6px 0; font-size:.77rem; }
.g-ust{ display:flex; justify-content:space-between; }
.g-alt{ color:var(--soluk); margin-top:2px; }
.durum{ font-size:.68rem; background:var(--zemin-2); border-radius:20px; padding:1px 8px; }
.durum.bekliyor{ background:var(--acik-vurgu); color:#8a6a2f; }

/* ---------- Açılır menüler ---------- */
.acilir-menu{
  position:absolute; z-index:120; background:var(--kagit); border:1px solid var(--cizgi);
  border-radius:var(--r); box-shadow:var(--golge-buyuk); padding:6px; min-width:210px;
}
.acilir-menu button{ display:block; width:100%; text-align:left; background:none; border:none; padding:8px 10px; border-radius:7px; cursor:pointer; font-size:.8rem; }
.acilir-menu button:hover{ background:var(--zemin-2); }
.menu-baslik{ font-size:.72rem; color:var(--soluk); padding:4px 8px 8px; }
.izin-satir{ display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:7px; font-size:.8rem; cursor:pointer; }
.izin-satir:hover{ background:var(--zemin-hover); }
/* Kutu yalnızca göstergedir; tıklamayı satır ele alır. */
.izin-satir input[type=checkbox]{ pointer-events:none; }
.izin-satir .izin-tur{ cursor:pointer; }
.izin-ad{ flex:1; }
.izin-tur{ padding:3px 6px; border:1px solid var(--cizgi); border-radius:6px; font-size:.72rem; }
.menu-alt{ border-top:1px solid var(--cizgi) !important; margin-top:6px; color:var(--soluk); }

/* ---------- Pencere ---------- */
.pencere-katman{ position:fixed; inset:0; background:rgba(20,20,22,.45); z-index:200; display:flex; align-items:center; justify-content:center; padding:18px; }
.pencere{ background:var(--kagit); border-radius:14px; box-shadow:var(--golge-buyuk); width:min(680px,100%); max-height:88vh; display:flex; flex-direction:column; }
.pencere header{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--cizgi); }
.pencere header h2{ font-size:.96rem; }
.pencere-kapat{ background:none; border:none; font-size:1rem; cursor:pointer; color:var(--soluk); }
.pencere-govde{ padding:16px; overflow:auto; }
.pencere-alt{ display:flex; gap:8px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--cizgi); }
.yapistir-alan{ width:100%; height:150px; padding:9px; border:1px solid var(--cizgi); border-radius:8px; font-family:ui-monospace,Menlo,monospace; font-size:.74rem; }
.bulgu-kutu{ margin-top:12px; background:var(--zemin-3); border:1px solid var(--cizgi); border-radius:9px; padding:11px; }
.bulgu-ust{ font-size:.72rem; color:var(--soluk); margin-bottom:8px; }
.bulgu-grup{ margin-bottom:7px; font-size:.8rem; }
.bulgu{ display:inline-block; background:var(--kagit); border:1px solid var(--cizgi); border-radius:20px; padding:2px 10px; margin:3px 5px 0 0; font-size:.76rem; }
.bulgu i{ color:var(--soluk); font-style:normal; font-size:.68rem; margin-right:4px; }
.bulgu-not{ font-size:.72rem; color:var(--soluk); margin-top:8px; line-height:1.5; }
.bulgu-not.iyi{ color:var(--artis); font-weight:600; }
.onizleme{ width:100%; font-size:.76rem; margin-top:4px; }
.onizleme th,.onizleme td{ border:1px solid var(--cizgi); padding:4px 7px; text-align:right; }
.onizleme thead th{ border-bottom-width:2px; }
.onizleme thead th{ background:var(--kagit); font-weight:600; }
.onizleme .on-gun{ text-align:left; white-space:nowrap; font-weight:600; }
.on-uyari{ color:var(--vurgu); font-size:.7rem; margin-left:3px; }
.on-kesin{ color:var(--artis); font-size:.72rem; margin-left:3px; }
.on-gecici{ color:var(--soluk); font-size:.72rem; margin-left:3px; }
.gun-kesin{ color:var(--artis); font-size:.62rem; margin-left:3px; vertical-align:1px; }
.uyari{ background:var(--dusus-zemin); color:var(--dusus); border-radius:8px; padding:9px 11px; font-size:.8rem; margin-top:10px; }
.personel-satir{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--cizgi); }
.personel-satir.pasif{ opacity:.55; }
.p-ad{ flex:1; padding:5px 9px; border:1px solid var(--cizgi); border-radius:7px; }
.p-durum{ font-size:.7rem; color:var(--soluk); width:38px; }
.personel-ekle{ display:flex; gap:7px; margin-top:11px; }
.personel-ekle input{ flex:1; padding:7px 9px; border:1px solid var(--cizgi); border-radius:7px; }
.urun-ust{ font-weight:700; margin-bottom:10px; }
.urun-tablo{ width:100%; font-size:.79rem; }
.urun-tablo th,.urun-tablo td{ border:1px solid var(--cizgi); padding:5px 8px; text-align:right; }
.urun-tablo thead th{ border-bottom-width:2px; }
.urun-tablo th:first-child,.urun-tablo td:first-child{ text-align:left; }
.urun-tablo thead th{ background:var(--zemin-3); }
.urun-tablo tr.one-cikan{ background:var(--acik-vurgu); }
.urun-rapor{ margin-top:11px; background:var(--zemin-3); border:1px solid var(--cizgi); border-radius:9px; padding:10px; font-size:.79rem; }
.urun-rapor b{ display:block; margin-bottom:5px; }
.urun-yukle{ margin-top:14px; display:flex; flex-direction:column; gap:7px; }
.urun-yukle label{ font-size:.75rem; color:var(--soluk); }
.urun-alan{ width:100%; height:92px; padding:8px; border:1px solid var(--cizgi); border-radius:8px; font-family:ui-monospace,Menlo,monospace; font-size:.75rem; }

/* ---------- Mobil: üst gezinme / orta tablo / alt kartlar ---------- */
/* 2×2 haftalık tablolar için yeterli genişlik yoksa (dizüstü ekranlar),
   özet sütunu alta iner ve hafta sütunları ekranın yarısını alır. */
@media (max-width: 1750px) and (min-width: 901px){
  .tuval-satir{ flex-wrap:wrap; }
  .tuval-satir > .tuval-yigin{ flex:1 1 calc(50% - 8px) !important; }
  .tuval-satir > .tuval-yigin:has(.tuval-blok[data-panel="ozet"]){ flex:1 1 100% !important; }
  .tuval-satir > .tuval-yigin:has(.tuval-blok[data-panel="ozet"]) .tuval-blok{ height:auto !important; }
  .tuval-ayirac{ display:none; }
}
@media (max-width: 1340px) and (min-width: 901px){
  /* Bu genişlikte iki tablo yan yana da sığmıyor; hepsi tek sütun. */
  .tuval-satir > .tuval-yigin{ flex:1 1 100% !important; }
}

@media (max-width: 900px){
  /* Dar ekranda bütün bloklar alt alta. */
  /* Dikey dizilişte bloklar kapsayıcıyı doldursun, içerik genişliğine büyümesin. */
  .tuval-satir{ flex-direction:column; gap:12px; align-items:stretch; }
  .tuval-yigin{ flex:1 1 auto !important; width:100%; }
  .tuval-blok{ flex:1 1 auto !important; height:auto !important; }
  .tuval-ayirac{ display:none; }
  .talep-ekran{ grid-template-columns:1fr; }
  .sayfa{ padding:10px; }
  .ust-cubuk{ padding:7px 10px; gap:8px; }
  .menu{ order:1; width:100%; overflow-x:auto; }
  .ust-orta{ order:3; width:100%; }
  .ust-sag{ order:2; margin-left:auto; }
  .hafta-gezinti{ flex-direction:column; gap:10px; }

  .duyuru-satir{ white-space:normal; }
  .hafta-listesi{ gap:6px; }
  .hafta-tablo{ min-width:640px; font-size:.74rem; }
  .ozet-tablo{ min-width:720px; }
  .yan-panel{ order:3; }
  .pencere{ max-height:92vh; }
  .profil-izgara{ grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:12px; }
}
@media (max-width: 560px){
  .hafta-ust{ gap:8px; }
  .hafta-hedef{ margin-left:0; width:100%; }
  .hafta-baslik{ font-size:.86rem; }
  .bolge-alt{ grid-template-columns:1fr; }
}

    const tema = TEMALAR.find((t) => t.id === id) || TEMALAR.find((t) => t.id === VARSAYILAN);
    const kok = document.documentElement;
    TEMALAR.forEach((t) => Object.keys(t.renkler).forEach((k) => kok.style.removeProperty(k)));

        await Promise.all(kayitlar.map((k) => k.unregister()));
      }
      if (window.caches) {
        const adlar = await caches.keys();
        await Promise.all(adlar.map((a) => caches.delete(a)));
      }
    } catch (e) {
    }
    location.reload();
  }

  </div>`);
    const simge = document.querySelector('link[rel="icon"]');
    if (simge) kok.querySelector(".giris-logo").style.backgroundImage = `url("${simge.href}")`;
    const mail = kok.querySelector("#girisEposta");
    const sifre = kok.querySelector("#girisSifre");
    const hata = kok.querySelector(".giris-hata");
    const btn = kok.querySelector(".giris-btn");
    const dene = async () => {
      hata.className = "giris-hata";
      if (!mail.value.trim() || !sifre.value) {
        hata.textContent = "Kullanıcı adı ve şifre gerekli.";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Giriş yapılıyor...";
      try {
        await authAl().signInWithEmailAndPassword(epostaYap(mail.value), sifre.value);
      } catch (e) {
        hata.textContent = girisHatasi(e);
      }
      btn.disabled = false;
      btn.textContent = "Giriş yap";
    };
    btn.addEventListener("click", dene);
    [mail, sifre].forEach((i) => i.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        dene();
      }
    }));
    kok.querySelector("#sifreUnuttum").addEventListener("click", async () => {
      const ad = mail.value.trim();
      if (!ad) {
        hata.textContent = "Önce kullanıcı adınızı yazın.";
        return;
      }
      if (!ad.includes("@")) {
        hata.className = "giris-hata";
        hata.textContent = "Kullanıcı adlarına posta gönderilemez. Şifrenizi kurucunuz değiştirir.";
        return;
      }
      try {
        await authAl().sendPasswordResetEmail(ad);
        hata.className = "giris-hata iyi";
        hata.textContent = "Sıfırlama bağlantısı gönderildi.";
      } catch (e) {
        hata.className = "giris-hata";
        hata.textContent = girisHatasi(e);
      }
    });
    setTimeout(() => mail.focus(), 60);
    return kok;
  }
  async function kullaniciBaglami(user) {
    const db2 = dbAl();
    const eposta = (user.email || "").toLowerCase();
    const sabitYonetici = YONETICI_EPOSTALARI.includes(eposta);
    let doc;
    try {
      doc = await db2.collection(KULLANICILAR).doc(user.uid).get();
    } catch (e) {
      throw new Error("Kullanıcı kaydınız okunamadı (" + (e.code || e.message) + "). Firestore kurallarının güncel sürümü yüklü olmayabilir.");
    }
    if (!doc.exists && sabitYonetici) {
      await db2.collection(KULLANICILAR).doc(user.uid).set({ eposta, rol: ROLLER.KURUCU, magazaKey: null });
      doc = await db2.collection(KULLANICILAR).doc(user.uid).get();
    }
    const veri = doc.exists ? doc.data() || {} : {};
    return {
      uid: user.uid,
      eposta,
      rol: sabitYonetici ? ROLLER.KURUCU : veri.rol || null,
      magazaKey: veri.magazaKey || null,
      kayitliMi: doc.exists
    };
  }
  var bekleyenMesaj = "";
  async function cikisYap(mesaj) {
    bekleyenMesaj = mesaj || "";
    bulutuKapat();
    await authAl().signOut();
    ciz(bulutGirisEkrani(bekleyenMesaj));
  }
  function eposta_ipucu(baglam) {
    return "Bu kullanıcı (" + kullaniciAdiYap(baglam.eposta) + ") hiçbir mağazaya bağlı değil.\nKurucu → Ayarlar → Kullanıcılar bölümünden bu kullanıcıyı bir mağazaya bağlayın.";
  }
  async function bulutOturumuAc(user) {
    ciz(el('<div class="acilis">Veriler yükleniyor…</div>'));
    const baglam = await kullaniciBaglami(user);
    if (!baglam.rol) {
      await cikisYap(eposta_ipucu(baglam));
      return;
    }
    await veriYukle(baglam);
    const profiller = profilleriGetir();
    if (!profiller.length) {
      if (baglam.rol === ROLLER.KURUCU) {
        ciz(kurulumEkrani(user));
        return;
      }
      await cikisYap("Sistem henüz kurulmamış. Kurucunun ilk kurulumu yapması gerekiyor.");
      return;
    }
    aktif = baglam.rol === ROLLER.MAGAZA ? profilGetir(baglam.magazaKey) : profiller.find((p) => p.rol === baglam.rol) || { key: baglam.rol, ad: baglam.eposta, rol: baglam.rol, simge: "👤", renk: "#3f6b8a" };
    if (!aktif) {
      await cikisYap("Hesabınıza bağlı mağaza (" + baglam.magazaKey + ") profil listesinde yok.");
      return;
    }
    bulutKullanicisi = baglam;
    sayfa = varsayilanSayfa(aktif);
    kurucuMagaza = null;
    uygulamaCiz();
  }
  function kurulumEkrani(user) {
    const kok = el(`<div class="giris-ekran">
    <div class="giris-kutu genis">
      <h1>İlk kurulum</h1>
      <p class="giris-aciklama">Bulutta henüz veri yok. Aşağıdaki düğme 20 mağaza,
        bölge müdürü ve kurucu profillerini, kategorileri ve yaklaşık 10 haftalık
        örnek veriyi Firestore'a yazar. Sonra mağaza kullanıcılarını
        Kurucu → Kullanıcılar bölümünden açarsınız.</p>
      <div class="giris-hata"></div>
      <button class="mini birincil kur-btn">Örnek veriyi buluta yaz</button>
      <button class="giris-bag" id="kurCik">Çıkış yap</button>
    </div>
  </div>`);
    const hata = kok.querySelector(".giris-hata");
    const btn = kok.querySelector(".kur-btn");
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Yazılıyor...";
      try {
        const adet = await bulutaTohumla();
        hata.className = "giris-hata iyi";
        hata.textContent = adet + " kayıt yazıldı. Uygulama açılıyor...";
        const kimlik = authAl().currentUser || user;
        setTimeout(() => {
          bulutOturumuAc(kimlik);
        }, 600);
      } catch (e) {
        hata.className = "giris-hata";
        hata.textContent = girisHatasi(e);
        btn.disabled = false;
        btn.textContent = "Örnek veriyi buluta yaz";
      }
    });
    kok.querySelector("#kurCik").addEventListener("click", () => authAl().signOut());
    return kok;
  }
  function girisEkrani(secilenKey) {
    const profiller = profilleriGetir();
    const secilen = secilenKey ? profilGetir(secilenKey) : null;
    const kok = el(`<div class="giris-ekran">
    <h1>Kim kullanıyor?</h1>
    <div class="profil-izgara"></div>
    <div class="giris-sifre" style="display:${secilen ? "" : "none"}">
      <div class="secilen-profil">
        <span class="p-simge" style="background:${secilen ? secilen.renk : ""}">${secilen ? secilen.simge : ""}</span>
        <span>${secilen ? esc(secilen.ad) : ""}</span>
      </div>
      <input type="password" class="sifre-girdi" placeholder="Şifre" autocomplete="current-password">
      <button class="mini birincil giris-btn">Giriş</button>
      <button class="mini geri-btn">← Geri</button>
      <div class="giris-hata"></div>
    </div>
    <p class="giris-not">Yerel deneme modu — Firebase bağlantısı yok. Örnek şifre: 1234</p>
  </div>`);
    const izgara = kok.querySelector(".profil-izgara");
    profiller.forEach((p) => {
      const kart = el(`<button class="profil-kart ${p.rol !== "magaza" ? "ozel" : ""}" data-key="${p.key}">
      <span class="p-simge" style="background:${p.renk}">${p.simge}</span>
      <span class="p-ad">${esc(p.ad)}</span>
    </button>`);
      kart.addEventListener("click", () => ciz(girisEkrani(p.key)));
      izgara.appendChild(kart);
    });
    if (secilen) {
      const girdi = kok.querySelector(".sifre-girdi");
      const hata = kok.querySelector(".giris-hata");
      const dene = () => {
        if (girdi.value === (secilen.sifre || "")) {
          oturumYaz(secilen.key);
          aktif = secilen;
          sayfa = varsayilanSayfa(secilen);
          uygulamaCiz();
        } else {
          hata.textContent = "Şifre yanlış.";
          girdi.value = "";
          girdi.focus();
        }
      };
      kok.querySelector(".giris-btn").addEventListener("click", dene);
      kok.querySelector(".geri-btn").addEventListener("click", () => ciz(girisEkrani(null)));
      girdi.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          dene();
        }
      });
      setTimeout(() => girdi.focus(), 60);
    }
    return kok;
  }
  function varsayilanSayfa(profil) {
    if (profil.rol === ROLLER.BOLGE) return "bolge";
    if (profil.rol === ROLLER.KURUCU) return "kurucu";
    return "ana";
  }
  function ustCubuk() {
    const magazaGibi = aktif.rol === ROLLER.MAGAZA || aktif.rol === ROLLER.KURUCU && kurucuMagaza;
    const menu = [];
    if (aktif.rol === ROLLER.MAGAZA) {
      menu.push(["ana", "Ana Sayfa"], ["talep", "Ürün Talepleri"]);
    } else if (aktif.rol === ROLLER.BOLGE) {
      menu.push(["bolge", "Özet"], ["talep-rapor", "Ürün Talepleri"]);
    } else {
      menu.push(["kurucu", "Ayarlar"], ["bolge", "Bölge Görünümü"], ["ana", "Mağaza Ekranı"], ["talep-rapor", "Ürün Talepleri"]);
    }
    const kok = el(`<header class="ust-cubuk">
    <button class="ust-logo" title="Ana sayfaya dön"><img alt="Mağaza Performans Takip"></button>
    <button class="surum-rozet" title="Sürüm — güncelleme için tıklayın">v${SURUM}</button>
    <nav class="menu">${menu.map(([k, a]) => `<button class="menu-btn ${sayfa === k ? "secili" : ""}" data-sayfa="${k}">${a}</button>`).join("")}</nav>
    <div class="ust-orta"></div>
    <div class="ust-sag">
      ${magazaGibi ? '<button class="mini birincil" data-yapistir="1">⬇ Yapıştır / Veri Ekle</button>' : ""}
      <button class="profil-rozet" title="Profil">
        <span class="p-simge kucuk" style="background:${aktif.renk}">${aktif.simge}</span>
        <span>${esc(kurucuMagaza ? profilGetir(kurucuMagaza).ad : aktif.ad)}</span>
      </button>
    </div>
  </header>`);
    if (aktif.rol === ROLLER.KURUCU) {
      const sec2 = el(`<select class="magaza-sec">
      <option value="">— mağaza seç —</option>
      ${magazalar().map((m) => `<option value="${m.key}" ${kurucuMagaza === m.key ? "selected" : ""}>${esc(m.ad)}</option>`).join("")}
    </select>`);
      sec2.addEventListener("change", () => {
        kurucuMagaza = sec2.value || null;
        if (kurucuMagaza) sayfa = "ana";
        uygulamaCiz();
      });
      kok.querySelector(".ust-orta").appendChild(sec2);
    }
    kok.querySelectorAll("[data-sayfa]").forEach((b) => b.addEventListener("click", () => {
      sayfa = b.dataset.sayfa;
      uygulamaCiz();
    }));
    const yap = kok.querySelector("[data-yapistir]");
    if (yap) yap.addEventListener("click", () => yapistirPenceresi(aktifMagaza(), uygulamaCiz));
    const logo = kok.querySelector(".ust-logo");
    const simge = document.querySelector('link[rel="icon"]');
    if (simge) logo.querySelector("img").src = simge.href;
    logo.addEventListener("click", () => {
      sayfa = varsayilanSayfa(aktif);
      uygulamaCiz();
    });
    kok.querySelector(".profil-rozet").addEventListener("click", profilMenusu);
    surumRozetiKur(kok.querySelector(".surum-rozet"));
    return kok;
  }
  var yeniSurum = null;
  function surumRozetiKur(rozet) {
    if (!rozet) return;
    const ciz2 = () => {
      rozet.classList.remove("guncel");
      if (yeniSurum && yeniSurum > SURUM) {
        rozet.classList.add("guncelleme");
        rozet.innerHTML = "v" + yeniSurum + ' <span class="surum-ok">↑</span>';
        rozet.title = "Yeni sürüm hazır (v" + yeniSurum + ") — yüklemek için tıklayın";
      } else {
        rozet.classList.remove("guncelleme");
        rozet.textContent = "v" + SURUM;
        rozet.title = "Sürüm v" + SURUM + " — güncelleme aramak için tıklayın";
      }
    };
    ciz2();
    rozet.addEventListener("click", async () => {
      if (yeniSurum && yeniSurum > SURUM) {
        rozet.textContent = "...";
        await guncelle();
        return;
      }
      rozet.textContent = "...";
      yeniSurum = await sunucuSurumu();
      ciz2();
      if (!(yeniSurum && yeniSurum > SURUM)) {
        rozet.classList.add("guncel");
        rozet.title = yeniSurum === null ? "Sunucuya ulaşılamadı; çevrimdışı olabilirsiniz." : "Son sürümü kullanıyorsunuz (v" + SURUM + ").";
        setTimeout(() => rozet.classList.remove("guncel"), 2e3);
      }
    });
  }
  async function surumKontrolSessiz() {
    const s = await sunucuSurumu();
    if (s === null) return;
    const oncekiyleAyni = yeniSurum === s;
    yeniSurum = s;
    if (!oncekiyleAyni && s > SURUM && aktif) uygulamaCiz();
  }
  function olcuModu() {
    const acik2 = document.body.classList.toggle("olcu-modu");
    document.querySelectorAll(".olcu-etiket,.olcu-referans").forEach((x) => x.remove());
    if (!acik2) return;
    const ref = el(`<div class="olcu-referans"><span>100 px</span></div>`);
    document.body.appendChild(ref);
    const yaz2 = () => {
      document.querySelectorAll(".olcu-etiket").forEach((x) => x.remove());
      document.querySelectorAll(".tuval-blok,.hafta-tablo,.ozet-tablo,.panel-kutu").forEach((el2) => {
        const r = el2.getBoundingClientRect();
        if (r.width < 40 || r.height < 24) return;
        const et = el(`<div class="olcu-etiket">${Math.round(r.width)} × ${Math.round(r.height)}</div>`);
        et.style.top = window.scrollY + r.top + 2 + "px";
        et.style.left = window.scrollX + r.left + 2 + "px";
        document.body.appendChild(et);
      });
    };
    yaz2();
    const tekrar = () => {
      if (document.body.classList.contains("olcu-modu")) yaz2();
    };
    window.addEventListener("resize", tekrar);
    window.addEventListener("scroll", tekrar);
  }
  function profilMenusu(e) {
    e.stopPropagation();
    document.querySelectorAll(".acilir-menu").forEach((m) => m.remove());
    const menu = el(`<div class="acilir-menu profil-menu">
    ${aktif.rol === ROLLER.MAGAZA ? '<button data-act="personel">👥 Personel</button>' : ""}
    ${TASINABILIR ? '<button data-act="yerlesim">🧩 Panel yerleşimini sıfırla</button>' : ""}
    ${bulutKullanicisi ? "" : '<button data-act="sifirla">♻ Örnek veriyi yenile</button>'}
    <div class="menu-ayrac"></div>
    <div class="menu-baslik">🎨 Tema</div>
    <div class="tema-liste">
      ${TEMALAR.map((t) => `<button class="tema-secim ${t.id === temaGetir() ? "secili" : ""}" data-tema="${t.id}">
        <span class="tema-ornek">${t.ornek.map((r2) => `<i style="background:${r2}"></i>`).join("")}</span>
        <span>${t.ad}</span>
      </button>`).join("")}
    </div>
    <div class="menu-ayrac"></div>
    <button data-act="olcu">📐 Ölçü modu ${document.body.classList.contains("olcu-modu") ? "(açık)" : ""}</button>
    <button data-act="cikis">🚪 ${bulutKullanicisi ? "Çıkış yap" : "Profil değiştir"}</button>
  </div>`);
    menu.querySelectorAll("[data-tema]").forEach((b) => b.addEventListener("click", (e2) => {
      e2.stopPropagation();
      temaYaz(b.dataset.tema);
      menu.querySelectorAll("[data-tema]").forEach((x) => x.classList.toggle("secili", x === b));
    }));
    menu.querySelectorAll("button[data-act]").forEach((b) => b.addEventListener("click", () => {
      menu.remove();
      if (b.dataset.act === "personel") personelPenceresi(aktifMagaza(), uygulamaCiz);
      if (b.dataset.act === "olcu") olcuModu();
      if (b.dataset.act === "yerlesim") {
        yerlesimSifirla(aktifMagaza());
        uygulamaCiz();
      }
      if (b.dataset.act === "cikis") {
        if (bulutVarMi() && authAl() && authAl().currentUser) {
          bulutuKapat();
          authAl().signOut();
        } else {
          oturumSil();
          aktif = null;
          kurucuMagaza = null;
          ciz(girisEkrani(null));
        }
      }
      if (b.dataset.act === "sifirla") {
        if (!confirm("Bütün yerel veri silinip örnek veri yeniden üretilecek. Devam?")) return;
        hepsiniSil();
        tohumla(true);
        oturumSil();
        aktif = null;
        ciz(girisEkrani(null));
      }
    }));
    document.body.appendChild(menu);
    const r = e.currentTarget.getBoundingClientRect();
    menu.style.top = window.scrollY + r.bottom + 6 + "px";
    menu.style.left = Math.min(r.left, window.innerWidth - 220) + "px";
    setTimeout(() => document.addEventListener("click", function k() {
      menu.remove();
      document.removeEventListener("click", k);
    }, { once: true }), 0);
  }
  function aktifMagaza() {
    if (aktif.rol === ROLLER.MAGAZA) return aktif.key;
    return kurucuMagaza || (magazalar()[0] || {}).key;
  }
  function sayfaIcerigi() {
    if (sayfa === "bolge") return bolgePaneli(seciliHafta(), (sonuc) => {
      if (sonuc && sonuc.magazaDetay) {
        kurucuMagaza = sonuc.magazaDetay;
        sayfa = "ana";
      }
      uygulamaCiz();
    });
    if (sayfa === "kurucu") return kurucuPaneli(uygulamaCiz);
    if (sayfa === "talep") return talepEkrani(aktifMagaza(), uygulamaCiz);
    if (sayfa === "talep-rapor") return talepRaporSayfasi();
    const magaza = aktifMagaza();
    if (!magaza) return el('<div class="bos-sayfa"><h2>Mağaza seçilmedi</h2><p>Üstteki listeden bir mağaza seçin.</p></div>');
    const duzenlenebilir = aktif.rol !== ROLLER.BOLGE;
    return magazaEkrani(magaza, { duzenlenebilir, yenile: uygulamaCiz });
  }
  function talepRaporSayfasi() {
    const pzt = pazartesi(bugun());
    const rapor = talepRaporu(pzt);
    const kok = el(`<div class="talep-rapor-sayfa">
    <div class="bolum-ust">
      <h2>Ürün talepleri</h2>
      <span class="alt">${haftaKey(pzt)} · gönderen ${rapor.gonderenler.length}, göndermeyen ${rapor.gondermeyenler.length}</span>
    </div>
    <div class="talep-ekran">
      <div class="talep-sol"></div>
      <aside class="talep-sag">
        <div class="panel-kutu">
          <h3>📦 Gönderen mağazalar</h3>
          <div class="rapor-liste">
            ${rapor.talepler.map((t) => {
      const m = profilGetir(t.magazaKey);
      return `<div class="rapor-satir"><b>${esc(m ? m.ad : t.magazaKey)}</b>
                <span>${t.satirlar.map((x) => esc(x.ad) + " ×" + x.adet).join(", ")}</span></div>`;
    }).join("") || '<div class="menu-bos">Bu hafta talep gelmedi.</div>'}
          </div>
        </div>
        <div class="panel-kutu">
          <h3>⚠ Göndermeyenler</h3>
          <div class="rapor-eksik">${rapor.gondermeyenler.map((m) => esc(m.ad)).join(", ") || "—"}</div>
        </div>
      </aside>
    </div>
  </div>`);
    kok.querySelector(".talep-sol").appendChild(urunTalepListesi(pzt));
    return kok;
  }
  function ciz(icerik) {
    kokEl.innerHTML = "";
    kokEl.appendChild(icerik);
  }
  function uygulamaCiz() {
    kapat();
    const sar = el('<div class="uygulama"></div>');
    sar.appendChild(ustCubuk());
    const govde = el('<main class="sayfa"></main>');
    govde.appendChild(sayfaIcerigi());
    sar.appendChild(govde);
    ciz(sar);
  }
  temaUygula(temaGetir());
  surumKontrolSessiz();
  setInterval(surumKontrolSessiz, 30 * 60 * 1e3);
  haftaSec(pazartesi(bugun()));
  if (baglan()) {
    authAl().onAuthStateChanged(async (user) => {
      if (!user) {
        aktif = null;
        kurucuMagaza = null;
        bulutKullanicisi = null;
        bulutuKapat();
        ciz(bulutGirisEkrani(bekleyenMesaj));
        bekleyenMesaj = "";
        return;
      }
      try {
        await bulutOturumuAc(user);
      } catch (e) {
        console.error(e);
        ciz(bulutGirisEkrani("Veriler yüklenemedi: " + (e && e.message ? e.message : e) + "\nGüvenlik kuralları bu hesaba izin vermiyor olabilir."));
      }
    });
  } else {
    tohumla(false);
    const oturum = oturumGetir();
    if (oturum && profilGetir(oturum.key)) {
      aktif = profilGetir(oturum.key);
      sayfa = varsayilanSayfa(aktif);
      uygulamaCiz();
    } else {
      ciz(girisEkrani(null));
    }
  }
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js").catch(() => {
    });
  }
})();

</script>
</body>
</html>
